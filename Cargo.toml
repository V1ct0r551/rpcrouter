[package]
name = "rpcrouter"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
description = "A resilient public JSON-RPC routing gateway"

[dependencies]
anyhow = "1"
axum = "0.8"
blake3 = "1"
dashmap = "6"
governor = "0.10"
httpdate = "1"
moka = { version = "0.12", features = ["future"] }
prometheus = "0.14"
rand = "0.9"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["http2", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.9"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
