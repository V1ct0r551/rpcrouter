# CI（ROADMAP P2.4）：三门槛 + 离线压测冒烟档。
#
# 触发：push / PR 到 main，另支持手动 workflow_dispatch。
# 工具链：固定到 MSRV 1.97.0（Cargo.toml 的 rust-version=1.97），满足“1.97/stable”。
# 离线说明：本仓库所有测试与压测均不触外网——chainlist 用本地样例/缓存、上游行为用
# 进程内 mock（见 AGENTS.md 约定），故整条流水线可离线稳定复现。
#
# 用单 job 顺序执行的理由：
#   - 步骤共享同一 target/ 目录与 Swatinem/rust-cache 缓存，避免拆 job 重复编译、
#     重复缓存下载，整体更省时、更稳；
#   - 冒烟压测依赖前面刚构建的 release 二进制，天然有先后依赖，拆并发无收益；
#   - 步骤都是几十秒内的小任务，无并行收益，顺序执行最简洁。

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  dashboard:
    name: dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Dashboard checks
        working-directory: dashboard
        run: npm ci && npm run lint && npm run typecheck && npm test && npm run build
  ci:
    name: fmt / clippy / test / smoke
    runs-on: ubuntu-latest
    # 防静默挂死烧额度：全流程(含 release 构建与冒烟)本机实测约 10 分钟,30 分钟足够宽裕
    timeout-minutes: 30
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (MSRV 1.97)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          # dtolnay 默认 minimal profile，不带 rustfmt/clippy，必须显式声明
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint (clippy, deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Test (offline suite)
        run: cargo test

      - name: Test ignored process-level cases (graceful shutdown)
        # 优雅退出的进程级用例依赖 kill 命令，Linux runner 支持，故显式补跑。
        env:
          REDIS_URL: redis://127.0.0.1:6379/0
        run: cargo test -- --ignored

      - name: Build release binaries
        # loadtest / mock-upstream 供 ci-smoke.sh 复用；release 带 thin LTO。
        run: cargo build --release --bins

      - name: Offline load smoke (assert user_visible_errors == 0 && p99 below loose threshold)
        run: bash scripts/ci-smoke.sh
