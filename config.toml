listen = "0.0.0.0:8545"
metrics_enabled = true
chains = [1, 143, 56, 137, 42161, 8453, 10, 43114]

[server]
batch_limit = 100

[chainlist]
url = "https://chainlist.org/rpcs.json"
refresh_seconds = 21600
stale_grace_seconds = 86400
cache_path = "./data/rpcs.json"

[upstream]
request_timeout_ms = 5000
slow_threshold_ms = 4000
deadline_ms = 15000
max_attempts = 4
default_rps = 15
default_concurrency = 8

[probe]
min_interval_seconds = 15
max_interval_seconds = 30
max_concurrency = 32
request_timeout_ms = 5000
max_block_lag = 5

[cache]
max_bytes = 536870912
immutable_ttl_seconds = 3600

[hedging]
enabled = true
delay_ms = 300
max_percent = 10
min_active_endpoints = 2

[[chain_overrides]]
chain_id = 1
block_time_ms = 12000
confirmation_depth = 64
tip_ttl_ms = 2000
extra_endpoints = []
disabled_endpoints = []

