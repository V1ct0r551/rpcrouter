# rpcrouter production alert rules
#
# Metric names must match src/metrics.rs exports:
#   - rpcrouter_user_visible_errors_total{chain_id}
#   - rpcrouter_ingress_rejected_total{reason}
#   - rpcrouter_endpoint_state{chain_id,endpoint,state}  (one-hot gauge)
#   - rpcrouter_cache_hit_ratio{chain_id}
#   - rpcrouter_cache_lookups_total{chain_id}
#   - rpcrouter_endpoint_rate_limited_total{chain_id,endpoint}
#   - rpcrouter_chain_upstream_requests_total{chain_id,endpoint}
#   - rpcrouter_chain_pinned{chain_id}  (v2: 1=pinned)
#   - rpcrouter_chains{state}  (v2: chain lifecycle counts)
#   - rpcrouter_catalog_chains  (v2)
#   - rpcrouter_probe_queue_depth  (v2)
#   - rpcrouter_probe_in_flight  (v2)
#   - rpcrouter_chainlist_last_refresh_timestamp_seconds  (v2)
#   - rpcrouter_chainlist_refresh_total{source}  (v2)
#   - rpcrouter_chain_activations_total  (v2)
#   - rpcrouter_chain_demotions_total{reason}  (v2)
#
# Semantic boundary (see guard.rs and metrics.rs):
#   - user_visible_errors: upstream promise metric; request entered data plane but all endpoints exhausted.
#   - ingress_rejected: ingress guard metric; request rejected before forwarding
#     (overload/body_too_large/rate_limited/unknown_chain/no_endpoints/chain_disabled).
#     Independent of user_visible_errors.
groups:
  - name: rpcrouter-availability
    rules:
      # Any user-visible error is an alert. This is the project's only hard promise to callers.
      - alert: RpcrouterUserVisibleErrors
        expr: sum by (chain_id) (rate(rpcrouter_user_visible_errors_total[2m])) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "chain {{ $labels.chain_id }} user-visible errors (all upstream endpoints exhausted)"
          description: "rpcrouter has no available endpoints for chain_id={{ $labels.chain_id }}. Callers receive -32000. Investigate endpoint pool immediately."

      # Active endpoints low water mark. v2: only watches pinned chains (rpcrouter_chain_pinned==1)
      # because dynamic chains with 1 endpoint are expected (1744 of 2877 chains have only 1 endpoint).
      - alert: RpcrouterChainActiveEndpointsLow
        expr: sum by (chain_id) (rpcrouter_endpoint_state{state="active"} * on(chain_id) group_left rpcrouter_chain_pinned == 1) < 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "pinned chain {{ $labels.chain_id }} has fewer than 2 active endpoints"
          description: "pinned chain_id={{ $labels.chain_id }} has only {{ $value }} active endpoints, insufficient for transparent failover/hedging. Possible causes: mass upstream 429/timeout, or chainlist refresh reduced endpoint pool."

  - name: rpcrouter-performance
    rules:
      # Cache hit ratio drop.
      - alert: RpcrouterCacheHitRatioDropped
        expr: max_over_time(rpcrouter_cache_hit_ratio[1m]) < 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "chain {{ $labels.chain_id }} cache hit ratio dropped"
          description: "chain_id={{ $labels.chain_id }} cache hit ratio fell to {{ $value | humanizePercentage }} (1-min window max). Confirm whether non-idempotent/cold data requests are flooding in, or immutable TTL is misconfigured."

  - name: rpcrouter-upstream-health
    rules:
      # Upstream 429 rate spike.
      - alert: RpcrouterUpstreamRateLimitedSpike
        expr: |
          (
            sum(rate(rpcrouter_endpoint_rate_limited_total[5m]))
            /
            clamp_min(sum(rate(rpcrouter_chain_upstream_requests_total[5m])), 1)
          ) > 0.10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "upstream 429 rate spike ({{ $value | humanizePercentage }})"
          description: "Endpoint rate-limited responses at {{ $value | humanizePercentage }} over 5 minutes, exceeding 10%. Gateway may be hitting upstream rate limits. Check for active endpoint low water mark and consider lowering default_rps or blocking hot endpoints."

      # Ingress rejection spike (overload signal).
      - alert: RpcrouterIngressRejectionsSpiking
        expr: sum by (reason) (rate(rpcrouter_ingress_rejected_total[3m])) > 0
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "ingress rejection spike (reason={{ $labels.reason }})"
          description: "Ingress guard is rejecting requests: reason={{ $labels.reason }}, rate {{ $value }} req/s over 3 minutes. overload=concurrency exceeded, body_too_large=request >256KiB, rate_limited=per-IP limit, unknown_chain=chain not in catalog, no_endpoints=chain has no public endpoints, chain_disabled=chain is denied/disabled. Note: this counter is independent of user_visible_errors."

  - name: rpcrouter-directory
    rules:
      # Chainlist refresh staleness: warn if last successful refresh > 2h ago.
      - alert: RpcrouterChainlistRefreshStale
        expr: (time() - rpcrouter_chainlist_last_refresh_timestamp_seconds) > 7200
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "chainlist refresh is stale (>2h since last success)"
          description: "Last successful chainlist refresh was {{ $value | humanizeDuration }} ago. The catalog may be outdated. Check network connectivity to chainlist.org and disk cache path."

      # Probe queue backing up: warn if queue depth > max_concurrency * 4.
      - alert: RpcrouterProbeQueueBackingUp
        expr: rpcrouter_probe_queue_depth > 128
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "probe queue depth {{ $value }} exceeds threshold"
          description: "Probe queue depth is {{ $value }}, exceeding 128. This may indicate slow upstream responses or too many hot chains. Check rpcrouter_probe_in_flight and upstream timeouts."