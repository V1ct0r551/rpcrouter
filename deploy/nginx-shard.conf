# rpcrouter 多实例分片入口样例（DESIGN-v2 §12 Phase A）：
# 按 /rpc/{chainId} 做一致性哈希，让每条链固定落到一个实例——缓存/折叠局部性最好，
# 每端点出站限流与探针不会随实例数放大。加减实例只迁移约 1/N 的链。
#
# 用法：把 upstream 里的地址换成实际实例；nginx -t && nginx -s reload。
# 生产建议：≥2 实例；nginx 自身用 keepalived/云 LB 做 HA；TLS 在此层终止。

map $uri $rpc_shard_key {
    # /rpc/1、/rpc/143 … 取 chainId 作为哈希键；其余路径（/healthz /chains /admin）用固定键，
    # 由 upstream 的 hash 一致性把它们发到同一实例（管理面用 /admin 时建议直连具体实例，
    # 或部署 W6 后经 Redis 集群视图查看全体实例）。
    "~^/rpc/(?<chain>[0-9]+)$"  $chain;
    default                     "default";
}

upstream rpcrouter_pool {
    hash $rpc_shard_key consistent;
    server 10.0.0.11:8545 max_fails=3 fail_timeout=10s;
    server 10.0.0.12:8545 max_fails=3 fail_timeout=10s;
    server 10.0.0.13:8545 max_fails=3 fail_timeout=10s;
    keepalive 256;
}

server {
    listen 80;
    # listen 443 ssl; ssl_certificate ...; ssl_certificate_key ...;
    server_name rpc.example.com;

    client_max_body_size 256k;          # 与网关 server.max_body_bytes 对齐
    proxy_read_timeout 20s;              # ≥ 网关 upstream.deadline_ms（15s）
    proxy_connect_timeout 2s;
    proxy_next_upstream error timeout http_502 http_503;   # 实例挂了走环上下一个
    proxy_next_upstream_tries 2;

    location /rpc/ {
        proxy_pass http://rpcrouter_pool;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /healthz {
        proxy_pass http://rpcrouter_pool;
    }

    # /metrics /admin 不对公网暴露：由内网 Prometheus / 运维直连各实例。
    location ~ ^/(metrics|admin) { return 404; }
}
