map $uri $rpc_shard_key { ~^/rpc/(?<chain>[0-9]+)$ $chain; default "default"; }
upstream rpcrouter_cluster { hash $rpc_shard_key consistent; server rpcrouter-1:8545; server rpcrouter-2:8545; server rpcrouter-3:8545; }
server { listen 80; location / { proxy_pass http://rpcrouter_cluster; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_read_timeout 20s; } }
